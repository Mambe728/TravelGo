<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>TravelGo | Reservar viaje</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link
        rel="stylesheet"
        href="css/estilos.css">

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="index.html">

            <i class="bi bi-airplane"></i>
            TravelGo

        </a>


        <button
            class="navbar-toggler"
            data-bs-toggle="collapse"
            data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div
            class="collapse navbar-collapse"
            id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="index.html">

                        Inicio

                    </a>

                </li>

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="destinos.html">

                        Destinos

                    </a>

                </li>

                <li class="nav-item">

                    <a
                        class="nav-link active"
                        href="reservas.html">

                        Reservar

                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- FORMULARIO -->

<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-9">

                <div class="card shadow border-0">

                    <div class="card-body p-5">

                        <div class="text-center mb-4">

                            <i class="bi bi-calendar-check display-4 text-primary"></i>

                            <h1 class="fw-bold mt-3">
                                Reserva tu viaje
                            </h1>

                            <p class="text-muted">
                                Completa los datos para generar
                                tu reservación.
                            </p>

                        </div>


                        <form id="reservationForm">


                            <!-- DATOS DEL CLIENTE -->

                            <h5 class="text-primary mb-3">
                                Datos del cliente
                            </h5>


                            <div class="row g-3">


                                <div class="col-md-6">

                                    <label class="form-label">
                                        Nombre completo
                                    </label>

                                    <input
                                        type="text"
                                        id="name"
                                        class="form-control"
                                        required>

                                </div>


                                <div class="col-md-6">

                                    <label class="form-label">
                                        Correo electrónico
                                    </label>

                                    <input
                                        type="email"
                                        id="email"
                                        class="form-control"
                                        required>

                                </div>


                            </div>


                            <hr class="my-4">


                            <!-- DATOS DEL VIAJE -->

                            <h5 class="text-primary mb-3">
                                Datos del viaje
                            </h5>


                            <div class="row g-3">


                                <div class="col-md-6">

                                    <label class="form-label">
                                        Destino
                                    </label>

                                    <select
                                        id="destination"
                                        class="form-select"
                                        required>

                                        <option value="">
                                            Selecciona un destino
                                        </option>

                                        <option value="6500">
                                            Cancún
                                        </option>

                                        <option value="18900">
                                            Bali
                                        </option>

                                        <option value="22500">
                                            París
                                        </option>

                                        <option value="16800">
                                            Nueva York
                                        </option>

                                        <option value="24500">
                                            Italia
                                        </option>

                                        <option value="27900">
                                            Japón
                                        </option>

                                    </select>

                                </div>


                                <div class="col-md-6">

                                    <label class="form-label">
                                        Número de viajeros
                                    </label>

                                    <input
                                        type="number"
                                        id="travelers"
                                        class="form-control"
                                        min="1"
                                        value="1"
                                        required>

                                </div>


                                <div class="col-md-6">

                                    <label class="form-label">
                                        Fecha de salida
                                    </label>

                                    <input
                                        type="date"
                                        id="departure"
                                        class="form-control"
                                        required>

                                </div>


                                <div class="col-md-6">

                                    <label class="form-label">
                                        Fecha de regreso
                                    </label>

                                    <input
                                        type="date"
                                        id="return"
                                        class="form-control"
                                        required>

                                </div>


                                <div class="col-md-6">

                                    <label class="form-label">
                                        Tipo de viaje
                                    </label>

                                    <select
                                        id="type"
                                        class="form-select">

                                        <option value="1">
                                            Económico
                                        </option>

                                        <option value="1.25">
                                            Estándar
                                        </option>

                                        <option value="1.6">
                                            Premium
                                        </option>

                                    </select>

                                </div>


                                <div class="col-md-6">

                                    <label class="form-label">
                                        Método de pago
                                    </label>

                                    <select
                                        id="payment"
                                        class="form-select">

                                        <option>
                                            Tarjeta de crédito
                                        </option>

                                        <option>
                                            Tarjeta de débito
                                        </option>

                                        <option>
                                            Transferencia bancaria
                                        </option>

                                    </select>

                                </div>


                                <div class="col-12">

                                    <label class="form-label">
                                        Comentarios
                                    </label>

                                    <textarea
                                        id="comments"
                                        class="form-control"
                                        rows="3"
                                        placeholder="Escribe alguna petición especial"></textarea>

                                </div>


                            </div>


                            <div class="d-grid mt-4">

                                <button
                                    type="submit"
                                    class="btn btn-primary btn-lg">

                                    <i class="bi bi-check-circle"></i>

                                    Confirmar reserva

                                </button>

                            </div>

                        </form>


                        <!-- RESULTADO -->

                        <div
                            id="reservationResult"
                            class="alert alert-success mt-4"
                            style="display:none;">

                            <h4>
                                ¡Reserva registrada!
                            </h4>

                            <p id="resultText"></p>

                        </div>


                    </div>

                </div>

            </div>

        </div>

    </div>

</section>


<footer class="bg-dark text-white text-center py-4">

    <p class="mb-0">
        © 2026 TravelGo | Agencia de Viajes
    </p>

</footer>


<script src="bootstrap.js"></script>

<script src="script.js"></script>

</body>

</html>
```
